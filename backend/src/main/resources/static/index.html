<!DOCTYPE html>
<html>
<head>
    <title>Spring OAuth2 Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 0;
        }
        .button:hover {
            background-color: #357ae8;
        }
        .endpoints {
            margin-top: 30px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Spring OAuth2 Demo</h1>
    
    <h2>Autenticación con Google</h2>
    <a href="/oauth2/authorization/google" class="button">
        🔐 Login con Google
    </a>
    
    <div class="endpoints">
        <h2>Endpoints de Prueba</h2>
        <ul>
            <li><a href="/api/oauth/user-info">/api/oauth/user-info</a> - Información del usuario OAuth</li>
            <li><a href="/api/users">/api/users</a> - Lista de usuarios en la BD</li>
            <li><a href="/api/auth/me">/api/auth/me</a> - Mi usuario (JWT)</li>
        </ul>
    </div>
    
    <script>
        // Mostrar mensaje de error si existe
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.body.innerHTML += `
                <div style="background-color: #ffebee; color: #c62828; padding: 15px; margin: 20px 0; border-radius: 5px;">
                    ❌ Error en el login. Intenta nuevamente.
                </div>
            `;
        }
        
        // Probar si ya hay sesión
        fetch('/api/oauth/user-info')
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('No autenticado');
            })
            .then(data => {
                document.body.innerHTML += `
                    <div style="background-color: #e8f5e9; color: #2e7d32; padding: 15px; margin: 20px 0; border-radius: 5px;">
                        ✅ Ya estás autenticado como: <strong>${data.email || 'Usuario'}</strong>
                    </div>
                `;
            })
            .catch(() => {
                // No autenticado, no mostrar nada
            });
    </script>
</body>
</html>
